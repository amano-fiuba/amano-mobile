server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que empiece con /api/ va al backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html nunca se cachea: cada deploy introduce hashes nuevos en los
    # assets, y así el navegador no queda pegado a un HTML desactualizado.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # El resto lo sirve el frontend; si la ruta no es un archivo, devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
